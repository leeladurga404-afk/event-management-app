<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events - Campus Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-bg">

  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Loading...</p>
  </div>

  <div id="app" class="d-none">
    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand">🎓 Campus Events</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto align-items-md-center gap-2">
            <li class="nav-item text-white" id="userName"></li>
            <li class="nav-item d-none" id="adminLinkItem">
              <a class="btn btn-warning btn-sm" href="admin.html">Admin Panel</a>
            </li>
            <li class="nav-item">
              <button class="btn btn-light btn-sm" id="logoutBtn">Logout</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div id="toastBox" class="alert d-none" role="alert"></div>

      <ul class="nav nav-pills mb-4">
        <li class="nav-item">
          <button class="nav-link active" id="tab-all" type="button">All Events</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" id="tab-mine" type="button">
            My Registrations <span class="badge bg-light text-dark" id="myCount">0</span>
          </button>
        </li>
      </ul>

      <section id="allSection">
        <div id="eventList" class="row g-3"></div>
        <p id="emptyAll" class="text-center text-muted py-5 d-none">No events available yet. Check back soon!</p>
      </section>

      <section id="mineSection" class="d-none">
        <div id="myList" class="row g-3"></div>
        <p id="emptyMine" class="text-center text-muted py-5 d-none">You haven't registered for any events yet.</p>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/events.js"></script>
</body>
</html>
