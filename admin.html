<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Campus Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-bg">

  <!-- Shown while we check that the user is an admin -->
  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Checking access...</p>
  </div>

  <div id="app" class="d-none">
    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand">🎓 Campus Events <span class="badge bg-warning text-dark">Admin</span></span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto align-items-md-center gap-2">
            <li class="nav-item text-white" id="userName"></li>
            <li class="nav-item">
              <button class="btn btn-light btn-sm" id="logoutBtn">Logout</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="h4 mb-0">Manage Events</h2>
        <button class="btn btn-primary" id="addEventBtn">+ Add Event</button>
      </div>

      <div id="eventList" class="row g-3"></div>
      <p id="emptyMsg" class="text-center text-muted py-5 d-none">No events yet. Click "Add Event" to create one.</p>
    </main>
  </div>

  <!-- Add / Edit modal -->
  <div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="eventForm">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Event</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="title">Title</label>
            <input type="text" class="form-control" id="title" required>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label" for="date">Date</label>
              <input type="date" class="form-control" id="date" required>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label" for="time">Time</label>
              <input type="time" class="form-control" id="time" required>
            </div>
          </div>
          <div class="row">
            <div class="col-7 mb-3">
              <label class="form-label" for="venue">Venue</label>
              <input type="text" class="form-control" id="venue" required>
            </div>
            <div class="col-5 mb-3">
              <label class="form-label" for="capacity">Capacity</label>
              <input type="number" class="form-control" id="capacity" min="1" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea class="form-control" id="description" rows="3" required></textarea>
          </div>
          <div id="formError" class="alert alert-danger d-none"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
