<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Campus Events</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="app-bg">

  <!-- Loading -->
  <div id="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Checking access...</p>
  </div>

  <!-- Admin App -->
  <div id="app" class="d-none">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-md navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand">
          🎓 Campus Events
          <span class="badge bg-warning text-dark">Admin</span>
        </span>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#nav"
          aria-controls="nav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto align-items-md-center gap-2">
            <li class="nav-item text-white" id="userName"></li>
            <li class="nav-item">
              <button class="btn btn-light btn-sm" id="logoutBtn">
                Logout
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">

      <!-- Manage Events -->
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="h4 mb-0">Manage Events</h2>
        <button class="btn btn-primary" id="addEventBtn">
          + Add Event
        </button>
      </div>

      <div id="eventList" class="row g-3"></div>

      <p
        id="emptyMsg"
        class="text-center text-muted py-5 d-none"
      >
        No events yet. Click "Add Event" to create one.
      </p>

      <!-- Registered Students -->
      <div class="card shadow-sm mt-4">
        <div class="card-body">

          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h2 class="h4 mb-0">Registered Students</h2>

            <span class="badge text-bg-primary">
              Total registrations:
              <span id="registrationCount">0</span>
            </span>
          </div>

          <div id="registrationsLoading" class="text-muted mb-3">
            Loading registrations...
          </div>

          <p id="registrationsEmptyMsg" class="text-muted d-none">
            No students have registered for events yet.
          </p>

          <div
            id="registrationsError"
            class="alert alert-danger d-none"
            role="alert"
          ></div>

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Student Name</th>
                  <th>Email</th>
                  <th>Event</th>
                  <th>Date</th>
                  <th>Time</th>
                  <th>Venue</th>
                </tr>
              </thead>

              <tbody id="registrationsTableBody"></tbody>
            </table>
          </div>

        </div>
      </div>

    </main>
  </div>

  <!-- Add / Edit Event Modal -->
  <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="eventForm">

        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add Event</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close"
          ></button>
        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label class="form-label" for="title">Title</label>
            <input type="text" class="form-control" id="title" required>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label" for="date">Date</label>
              <input type="date" class="form-control" id="date" required>
            </div>

            <div class="col-6 mb-3">
              <label class="form-label" for="time">Time</label>
              <input type="time" class="form-control" id="time" required>
            </div>
          </div>

          <div class="row">
            <div class="col-7 mb-3">
              <label class="form-label" for="venue">Venue</label>
              <input type="text" class="form-control" id="venue" required>
            </div>

            <div class="col-5 mb-3">
              <label class="form-label" for="capacity">Capacity</label>
              <input
                type="number"
                class="form-control"
                id="capacity"
                min="1"
                required
              >
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="description">Description</label>
            <textarea
              class="form-control"
              id="description"
              rows="3"
              required
            ></textarea>
          </div>

          <div id="formError" class="alert alert-danger d-none"></div>
        </div>

        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>

          <button type="submit" class="btn btn-primary" id="saveBtn">
            Save
          </button>
        </div>

      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/admin.js"></script>

</body>
</html>
