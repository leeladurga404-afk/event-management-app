<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Events - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container auth-wrapper">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-5">
        <div class="text-center mb-4">
          <h1 class="brand">🎓 Campus Events</h1>
          <p class="text-muted">Discover and register for college events</p>
        </div>

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <ul class="nav nav-pills nav-fill mb-4" id="authTabs">
              <li class="nav-item">
                <button class="nav-link active" id="tab-login" type="button">Login</button>
              </li>
              <li class="nav-item">
                <button class="nav-link" id="tab-signup" type="button">Sign Up</button>
              </li>
            </ul>

            <div id="message" class="alert d-none" role="alert"></div>

            <!-- Login form -->
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" required>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" required>
              </div>
                            <div class="text-end mb-3">
                <a href="#" id="forgotLink" class="small">Forgot password?</a>
              </div>
              <button type="submit" class="btn btn-primary w-100" id="loginBtn">Login</button>
            </form>

            <!-- Signup form -->
            <form id="signupForm" class="d-none">
              <div class="mb-3">
                <label for="signupName" class="form-label">Full name</label>
                <input type="text" class="form-control" id="signupName" required>
              </div>
              <div class="mb-3">
                <label for="signupEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="signupEmail" required>
              </div>
              <div class="mb-3">
                <label for="signupPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="signupPassword" minlength="6" required>
                <div class="form-text">At least 6 characters.</div>
              </div>
              <button type="submit" class="btn btn-success w-100" id="signupBtn">Create account</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
